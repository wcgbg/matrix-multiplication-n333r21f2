name: Build, verify, and reproduce
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            compiler: gcc
          - os: ubuntu-26.04
            compiler: clang-22
          - os: macos-15
            compiler: apple-clang
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          persist-credentials: false
      - name: Select the default GCC (15) on Linux
        if: matrix.compiler == 'gcc'
        run: |
          echo 'CC=/usr/bin/gcc' >> "$GITHUB_ENV"
          echo 'CXX=/usr/bin/g++' >> "$GITHUB_ENV"
      - name: Install Clang 22 on Linux
        if: matrix.compiler == 'clang-22'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-22 libclang-rt-22-dev llvm-22-linker-tools
          echo 'CC=/usr/bin/clang-22' >> "$GITHUB_ENV"
          echo 'CXX=/usr/bin/clang++-22' >> "$GITHUB_ENV"
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          disk-cache: ${{ matrix.os }}-${{ matrix.compiler }}
          cache-save: ${{ github.event_name != 'pull_request' }}
          bazelrc: |
            build --jobs=2
            test --test_output=errors
      - name: Record toolchain
        run: |
          bazel --version
          "${CXX:-clang++}" --version
          python3 --version
          git lfs fsck
      - name: Python and artifact checks
        run: |
          python3 -m unittest -v run_test release_test
          python3 release.py
      - name: Regular C++ tests
        run: bazel test --config=opt //...
      - name: Quick ternary reproduction
        run: |
          python3 run.py verify-cert q03_n233
          python3 run.py verify-table q03_n233 --histogram
          python3 run.py profile q03_n233
          python3 run.py cross-check q03_n233 restrictions
      - name: Sanitizer instrumentation and regression tests
        if: matrix.compiler != 'gcc'
        run: >-
          bazel test --config=debug --copt=-O2
          //core:sanitizer_probe_test //core:constraints_test
          //core:gf_test //subspace_bounds/verifier:verifier_test
          //profiles:fp_search_test //profiles:q02_n333_search_test
      - name: Capture reproduction evidence
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          args = [sys.executable, 'release.py', '--manifest', 'tmp/release-manifest.json']
          for path in sorted(Path('log/reproduction').glob('*.log')):
              args += ['--log', str(path)]
          subprocess.run(args, check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            tmp/release-manifest.json
            log/reproduction/*.log
            bazel-testlogs/**/test.log
